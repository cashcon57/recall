# Example only. Copy to .github/workflows/recall-update.yml if you want it.
# Requires repository secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
# Do not store MEMORY_API_KEY in this workflow unless you need authenticated MCP smoke tests.

name: Recall weekly update check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

jobs:
  check-test-and-optional-apply:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Optional for smoke tests if your worker URL is not detectable from wrangler.toml.
      # RECALL_WORKER_URL: https://your-worker.workers.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Updater check
        run: ./recall-update.sh --check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Opt-in only. Uncomment after you are comfortable with automated deploys
      # and after verifying your migrations/rollback process.
      #
      # - name: Apply update and deploy
      #   if: github.event_name == 'workflow_dispatch'
      #   run: ./recall-update.sh --apply --yes
